<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title description">
  <title id="title">Масштабування змінює найближчого сусіда k-NN</title>
  <desc id="description">Без масштабування Q найближча до B1 через велику шкалу другої ознаки. Після MinMax перетворення найближчою стає A1.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 23px; font-weight: 700; }
    .heading { font-size: 17px; font-weight: 700; }
    .label { font-size: 13px; }
    .small { font-size: 12px; fill: #475569; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .nearest { stroke: #111827; stroke-width: 3; }
    .a { fill: #ea580c; stroke: white; stroke-width: 2; }
    .b { fill: #2563eb; stroke: white; stroke-width: 2; }
    .q { fill: #111827; stroke: white; stroke-width: 2; }
  </style>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text class="title" x="500" y="34" text-anchor="middle">Одна query Q, різний масштаб координат — різний сусід</text>

  <rect class="panel" x="25" y="55" width="455" height="360" rx="12"/>
  <text class="heading" x="252" y="84" text-anchor="middle">Початкові одиниці</text>
  <line class="grid" x1="85" y1="120" x2="435" y2="120"/>
  <line class="grid" x1="85" y1="190" x2="435" y2="190"/>
  <line class="grid" x1="85" y1="260" x2="435" y2="260"/>
  <line class="grid" x1="85" y1="330" x2="435" y2="330"/>
  <line class="axis" x1="85" y1="330" x2="435" y2="330"/>
  <line class="axis" x1="85" y1="110" x2="85" y2="330"/>
  <line class="nearest" x1="85" y1="330" x2="365" y2="330"/>
  <circle class="a" cx="155" cy="120" r="9"/>
  <circle class="b" cx="365" cy="330" r="9"/>
  <circle class="a" cx="295" cy="141" r="9"/>
  <polygon class="q" points="85,318 97,330 85,342 73,330"/>
  <text class="label" x="166" y="118">A1 (1,100)</text>
  <text class="label" x="340" y="310">B1 (4,0)</text>
  <text class="label" x="305" y="139">A2 (3,90)</text>
  <text class="label" x="98" y="350">Q (0,0)</text>
  <text class="small" x="252" y="378" text-anchor="middle">d(Q,B1)=4; інші відстані ≈90–100</text>
  <text class="small" x="252" y="397" text-anchor="middle">Найближча: B1, клас B</text>

  <rect class="panel" x="520" y="55" width="455" height="360" rx="12"/>
  <text class="heading" x="747" y="84" text-anchor="middle">Після MinMaxScaler</text>
  <line class="grid" x1="585" y1="120" x2="935" y2="120"/>
  <line class="grid" x1="585" y1="190" x2="935" y2="190"/>
  <line class="grid" x1="585" y1="260" x2="935" y2="260"/>
  <line class="grid" x1="585" y1="330" x2="935" y2="330"/>
  <line class="axis" x1="585" y1="330" x2="935" y2="330"/>
  <line class="axis" x1="585" y1="110" x2="585" y2="330"/>
  <line class="nearest" x1="619" y1="330" x2="688" y2="120"/>
  <circle class="a" cx="688" cy="120" r="9"/>
  <circle class="b" cx="860" cy="330" r="9"/>
  <circle class="a" cx="803" cy="141" r="9"/>
  <polygon class="q" points="619,318 631,330 619,342 607,330"/>
  <text class="label" x="700" y="118">A1 (0,1)</text>
  <text class="label" x="835" y="310">B1 (1,0)</text>
  <text class="label" x="812" y="139">A2 (0.667,0.9)</text>
  <text class="label" x="632" y="350">Q (-0.333,0)</text>
  <text class="small" x="747" y="378" text-anchor="middle">d(Q,A1)≈1.054; d(Q,B1)≈1.333</text>
  <text class="small" x="747" y="397" text-anchor="middle">Найближча: A1, клас A</text>
</svg>
