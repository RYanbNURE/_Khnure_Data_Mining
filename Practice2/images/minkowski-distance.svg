<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title description">
  <title id="title">Відстані L1, L2 і L3 на двох координатах</title>
  <desc id="description">Між точками A=(1,2) і B=(4,6) Manhattan-відстань дорівнює 7, евклідова — 5, а L3 — приблизно 4,498.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 15px; }
    .small { font-size: 13px; fill: #475569; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 2; }
  </style>
  <rect width="900" height="430" fill="#ffffff"/>
  <text class="title" x="450" y="34" text-anchor="middle">Відстань Мінковського між A=(1,2) та B=(4,6)</text>
  <line class="grid" x1="120" y1="110" x2="690" y2="110"/>
  <line class="grid" x1="120" y1="152" x2="690" y2="152"/>
  <line class="grid" x1="120" y1="194" x2="690" y2="194"/>
  <line class="grid" x1="120" y1="236" x2="690" y2="236"/>
  <line class="grid" x1="120" y1="278" x2="690" y2="278"/>
  <line class="grid" x1="215" y1="68" x2="215" y2="320"/>
  <line class="grid" x1="310" y1="68" x2="310" y2="320"/>
  <line class="grid" x1="405" y1="68" x2="405" y2="320"/>
  <line class="grid" x1="500" y1="68" x2="500" y2="320"/>
  <line class="grid" x1="595" y1="68" x2="595" y2="320"/>
  <line class="grid" x1="690" y1="68" x2="690" y2="320"/>
  <line class="axis" x1="120" y1="320" x2="710" y2="320"/>
  <line class="axis" x1="120" y1="320" x2="120" y2="68"/>
  <text class="small" x="120" y="342" text-anchor="middle">0</text>
  <text class="small" x="215" y="342" text-anchor="middle">1</text>
  <text class="small" x="310" y="342" text-anchor="middle">2</text>
  <text class="small" x="405" y="342" text-anchor="middle">3</text>
  <text class="small" x="500" y="342" text-anchor="middle">4</text>
  <text class="small" x="595" y="342" text-anchor="middle">5</text>
  <text class="small" x="690" y="342" text-anchor="middle">6</text>
  <text class="small" x="102" y="324" text-anchor="end">0</text>
  <text class="small" x="102" y="282" text-anchor="end">1</text>
  <text class="small" x="102" y="240" text-anchor="end">2</text>
  <text class="small" x="102" y="198" text-anchor="end">3</text>
  <text class="small" x="102" y="156" text-anchor="end">4</text>
  <text class="small" x="102" y="114" text-anchor="end">5</text>
  <text class="small" x="102" y="72" text-anchor="end">6</text>
  <text class="label" x="710" y="342">x₁</text>
  <text class="label" x="95" y="72">x₂</text>

  <polyline points="215,236 500,236 500,68" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="9 6"/>
  <line x1="215" y1="236" x2="500" y2="68" stroke="#2563eb" stroke-width="4"/>
  <circle cx="215" cy="236" r="9" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="500" cy="68" r="9" fill="#7c3aed" stroke="white" stroke-width="2"/>
  <text class="label" x="185" y="222">A</text>
  <text class="label" x="515" y="70">B</text>

  <line x1="725" y1="105" x2="770" y2="105" stroke="#ea580c" stroke-width="4" stroke-dasharray="9 6"/>
  <text class="small" x="780" y="110">L1-шлях</text>
  <line x1="725" y1="135" x2="770" y2="135" stroke="#2563eb" stroke-width="4"/>
  <text class="small" x="780" y="140">L2-відрізок</text>
  <text class="label" x="725" y="190">Δx₁=3, Δx₂=4</text>
  <text class="small" x="725" y="218">L1 = 3 + 4 = 7</text>
  <text class="small" x="725" y="244">L2 = √(3²+4²) = 5</text>
  <text class="small" x="725" y="270">L3 = ∛(3³+4³) ≈ 4.498</text>
  <text class="small" x="450" y="390" text-anchor="middle">Манхеттенський шлях іде вздовж осей; L2 вимірює пряму лінію.</text>
</svg>
