<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title description">
  <title id="title">Вибір числа кластерів за inertia та silhouette</title>
  <desc id="description">Для точок 1, 2, 8, 9 inertia зменшується від 50 при одному кластері до нуля при чотирьох. Silhouette найбільший для двох кластерів: приблизно 0,856.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
    .heading { font-size: 18px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #4b5563; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #475569; stroke-width: 1.5; }
    .inertia { fill: none; stroke: #2563eb; stroke-width: 3; }
    .silhouette { fill: none; stroke: #ea580c; stroke-width: 3; }
  </style>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text class="title" x="500" y="36" text-anchor="middle">Як обрати K для точок {1, 2, 8, 9}</text>

  <rect x="30" y="58" width="455" height="385" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="heading" x="257" y="88" text-anchor="middle">Inertia: менше не завжди краще</text>
  <line class="grid" x1="95" y1="112" x2="455" y2="112"/>
  <line class="grid" x1="95" y1="154" x2="455" y2="154"/>
  <line class="grid" x1="95" y1="196" x2="455" y2="196"/>
  <line class="grid" x1="95" y1="238" x2="455" y2="238"/>
  <line class="grid" x1="95" y1="280" x2="455" y2="280"/>
  <line class="grid" x1="95" y1="322" x2="455" y2="322"/>
  <line class="axis" x1="95" y1="322" x2="455" y2="322"/>
  <line class="axis" x1="95" y1="112" x2="95" y2="322"/>
  <text class="small" x="82" y="326" text-anchor="end">0</text>
  <text class="small" x="82" y="284" text-anchor="end">10</text>
  <text class="small" x="82" y="242" text-anchor="end">20</text>
  <text class="small" x="82" y="200" text-anchor="end">30</text>
  <text class="small" x="82" y="158" text-anchor="end">40</text>
  <text class="small" x="82" y="116" text-anchor="end">50</text>
  <text class="small" x="56" y="215" transform="rotate(-90 56 215)" text-anchor="middle">Inertia</text>
  <polyline class="inertia" points="145,112 245,317.8 345,319.9 445,322"/>
  <circle cx="145" cy="112" r="6" fill="#2563eb"/>
  <circle cx="245" cy="317.8" r="6" fill="#2563eb"/>
  <circle cx="345" cy="319.9" r="6" fill="#2563eb"/>
  <circle cx="445" cy="322" r="6" fill="#2563eb"/>
  <text class="label" x="145" y="102" text-anchor="middle">50</text>
  <text class="label" x="245" y="301" text-anchor="middle">1</text>
  <text class="label" x="345" y="304" text-anchor="middle">0.5</text>
  <text class="label" x="445" y="306" text-anchor="middle">0</text>
  <text class="small" x="145" y="344" text-anchor="middle">1</text>
  <text class="small" x="245" y="344" text-anchor="middle">2</text>
  <text class="small" x="345" y="344" text-anchor="middle">3</text>
  <text class="small" x="445" y="344" text-anchor="middle">4</text>
  <text class="label" x="275" y="370" text-anchor="middle">Кількість кластерів K</text>
  <text class="small" x="257" y="407" text-anchor="middle">Inertia спадає до 0, якщо кожна точка — окремий кластер.</text>

  <rect x="515" y="58" width="455" height="385" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="heading" x="742" y="88" text-anchor="middle">Silhouette: компактність і розділеність</text>
  <line class="grid" x1="580" y1="112" x2="940" y2="112"/>
  <line class="grid" x1="580" y1="164.5" x2="940" y2="164.5"/>
  <line class="grid" x1="580" y1="217" x2="940" y2="217"/>
  <line class="grid" x1="580" y1="269.5" x2="940" y2="269.5"/>
  <line class="grid" x1="580" y1="322" x2="940" y2="322"/>
  <line class="axis" x1="580" y1="322" x2="940" y2="322"/>
  <line class="axis" x1="580" y1="112" x2="580" y2="322"/>
  <text class="small" x="568" y="326" text-anchor="end">-1</text>
  <text class="small" x="568" y="273.5" text-anchor="end">-0.5</text>
  <text class="small" x="568" y="221" text-anchor="end">0</text>
  <text class="small" x="568" y="168.5" text-anchor="end">0.5</text>
  <text class="small" x="568" y="116" text-anchor="end">1</text>
  <text class="small" x="540" y="217" transform="rotate(-90 540 217)" text-anchor="middle">Silhouette</text>
  <line class="silhouette" x1="700" y1="127.1" x2="820" y2="173.1"/>
  <circle cx="700" cy="127.1" r="7" fill="#ea580c"/>
  <circle cx="820" cy="173.1" r="7" fill="#ea580c"/>
  <text class="label" x="700" y="115" text-anchor="middle">0.856</text>
  <text class="label" x="820" y="161" text-anchor="middle">0.423</text>
  <text class="small" x="610" y="205" text-anchor="middle">N/A</text>
  <text class="small" x="920" y="205" text-anchor="middle">N/A</text>
  <text class="small" x="610" y="344" text-anchor="middle">1</text>
  <text class="small" x="700" y="344" text-anchor="middle">2</text>
  <text class="small" x="820" y="344" text-anchor="middle">3</text>
  <text class="small" x="920" y="344" text-anchor="middle">4</text>
  <text class="label" x="760" y="370" text-anchor="middle">Кількість кластерів K</text>
  <text class="small" x="742" y="407" text-anchor="middle">Для цього набору silhouette підтримує K=2.</text>
</svg>
